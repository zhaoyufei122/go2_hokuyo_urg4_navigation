amcl:
  ros__parameters:
    use_sim_time: false
    # Motion model noise. The Nav2 defaults (0.2 everywhere) are tuned for a
    # wheeled robot with encoder odometry. A trotting GO2 estimates heading
    # from leg kinematics and IMU, and its yaw is by far the worst axis, so
    # the rotational terms get much more noise than the translational ones.
    # This is not cosmetic: the per-update yaw spread is sqrt(alpha)*|motion|,
    # and it is the ONLY thing that lets particles reach a better heading. Too
    # little and AMCL cannot climb out to a pose ~10 deg away even when that
    # pose fits the map six times better -- it just sits at the compromise
    # between its motion prior and the scan.
    # 0.8 was an overshoot: extra process noise only helps if the sensor model
    # can then pick the good particles out again. Paired with a narrow
    # sigma_hit it just makes the dead reckoning diffuse faster.
    alpha1: 0.5   # yaw noise from rotating
    alpha2: 0.5   # yaw noise from translating (heading drifts while walking)
    alpha3: 0.2   # xy noise from translating (leg odometry distance is ok)
    alpha4: 0.3   # xy noise from rotating (the dog shuffles as it turns)
    alpha5: 0.2   # unused by DifferentialMotionModel; Omni only
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    always_reset_initial_pose: false
    set_initial_pose: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # The URG-04LX-UG01 is a 4 m sensor and scan_filter caps range_max at 4.0.
    # AMCL takes min(laser_max_range, scan.range_max), so anything larger here
    # is silently ignored; keep it honest so the real limit is obvious.
    laser_max_range: 4.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 5000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Augmented-MCL "kidnapped robot" recovery. Non-zero values make AMCL
    # replace part of the cloud with poses drawn uniformly from the whole map
    # whenever the recent scan likelihood dips below the long-run average. On a
    # trotting quadruped with a 4 m lidar that condition is met almost every
    # frame, so the cloud never converges (measured: 4.6 x 3.3 m spread) and
    # map->odom jumps around. Keep both at the Nav2 default of 0.0; recover
    # from a real kidnapping with a 2D Pose Estimate instead.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # Width of the likelihood-field Gaussian == how far off AMCL can still
    # tell that a pose is wrong. Signal left above the z_rand floor for a scan
    # point that misses the wall by:
    #            0.1 m   0.2 m   0.3 m   0.5 m
    #   0.1  ->    61%     14%      1%      0%
    #   0.3  ->    95%     80%     61%     25%
    # At 0.1 the capture range is about +-0.2 m: past that every particle
    # scores the same, resampling turns into a coin flip, and the filter
    # degenerates into dead reckoning off the initial pose -- which is exactly
    # the reported symptom. Measured: scan-to-map 5.2 cm at 17:35 and 60.8 cm
    # 16 minutes later in the SAME run, particle cloud grown to 7.4 x 8.1 m.
    sigma_hit: 0.3
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      # Goals behind the robot need rotate-then-drive, which shows no
      # translation for several seconds; 15 s triggered abort+clear loops.
      movement_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true  # 2026-08-25：开！近膨胀区自动减速，转弯半径=线速度/角速度，减速才能转过来不切弯
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      # Trigger rotate-in-place for anything beyond ~20 deg: arc-creeping at
      # high curvature outputs <0.1 rad/s, which the cmd_vel bridge deadband
      # then zeroes out, leaving the dog frozen until the progress timeout.
      rotate_to_heading_min_angle: 0.35
      # RPP clamps the commanded rotation rate to
      #   curr_angular_speed + max_angular_accel * control_dt.
      # 2026-07-18 实测：0.35 rad/s 原地转向基本不动（2.5s 只转 6.5°，
      # Go2 转向真实地板 ~0.5），而 /odom 角速度反馈保持 0 → ramp 永远
      # 停在 0.35 死循环。8.0 让首周期命令直接到上限 0.8，一把推过地板；
      # 狗转起来后反馈为正，之后被 rotate_to_heading_angular_vel 0.8 钳住。
      max_angular_accel: 8.0
      # Reversing is allowed for short backing maneuvers; note the lidar
      # blind zone is at the rear, so the StopZone cannot see there.
      allow_reversing: false  # 2026-08-19：巡逻必须正向（点2→点3曾被倒开）；倒开拖行走 task_planner 自己的倒车控制器
      stateful: true
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.35
      vx_min: -0.15
      vy_max: 0.5
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Scan timestamps come from the Jetson, whose clock lags the PC by
      # ~1-2 s after the ssh-based date sync; 0.1 s default is too tight.
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20]]"
      # 2026-08-25（pic22-25）：旋转时 footprint 角落扫进膨胀区。pad 5cm
      # 让规划器把路径放得离障碍更远，等效“绕大一点的弯”
      footprint_padding: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-24 实测（test5）：walker 旁有障碍物时 0.30m 膨胀把实际可通行
        # 空间全吃掉（0.9m 通道只剩 0.3m < footprint 半宽），Nav2 拒不动弹。
        # Go2 实际宽度 0.4m。用户评 0.15 太激进，取 0.20 折中。
        cost_scaling_factor: 2.5
        inflation_radius: 0.30
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          # scan_filter replaces out-of-range readings with +inf. Without
          # inf_is_valid the ObstacleLayer drops those beams entirely -- no
          # marking AND no ray clearing -- so every phantom return (body pitch
          # hitting the floor, someone walking past) stays in the costmap
          # forever. With it, +inf becomes range_max - 1e-4 = 3.9999 m.
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Must stay >= scan.range_max (4.0) so those synthetic max-range
          # points clear their whole ray.
          raytrace_max_range: 4.5
          raytrace_min_range: 0.25
          # Must stay < scan.range_max (4.0), or the 3.9999 m points that
          # inf_is_valid creates get marked as a ring of obstacles at 4 m.
          obstacle_max_range: 3.5
          obstacle_min_range: 0.25
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      # 全局规划用圆形 footprint：旋转扫掠半径 = √(0.35²+0.20²)+0.02 余量
      # ≈ 0.42m（2026-08-25 pic22-27：矩形 footprint 原地旋转角落扫进膨胀区）。
      # 全局路径保持 ≥0.42m 净空 → 任何位置原地转都安全；局部仍用矩形
      # （精对准 walker 不受影响，FIND 有自己的雷达安全门）。
      robot_radius: 0.42
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          # scan_filter replaces out-of-range readings with +inf. Without
          # inf_is_valid the ObstacleLayer drops those beams entirely -- no
          # marking AND no ray clearing -- so every phantom return (body pitch
          # hitting the floor, someone walking past) stays in the costmap
          # forever. With it, +inf becomes range_max - 1e-4 = 3.9999 m.
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Must stay >= scan.range_max (4.0) so those synthetic max-range
          # points clear their whole ray.
          raytrace_max_range: 4.5
          raytrace_min_range: 0.25
          # Must stay < scan.range_max (4.0), or the 3.9999 m points that
          # inf_is_valid creates get marked as a ring of obstacles at 4 m.
          obstacle_max_range: 3.5
          obstacle_min_range: 0.25
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-24 实测（test5）：同 local costmap，0.30→0.20
        cost_scaling_factor: 2.5
        inflation_radius: 0.30
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    use_sim_time: false
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.8]
    min_velocity: [-0.4, 0.0, -0.8]
    max_accel: [0.6, 0.0, 0.8]
    max_decel: [-0.8, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 0.5
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"
      points: "[[0.45, 0.28], [0.45, -0.28], [-0.40, -0.28], [-0.40, 0.28]]"
      action_type: "stop"
      min_points: 4
      visualize: True
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.3
      v_linear_max: 0.3
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
